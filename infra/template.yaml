AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: AI Biomedical Research Assistant - Full Stack AWS Application

Globals:
  Function:
    Runtime: python3.12
    Timeout: 60
    MemorySize: 256
    Environment:
      Variables:
        AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
        AWS_LWA_INVOKE_MODE: response_stream
        PORT: "8080"
    Layers:
      - !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27

Resources:

  # ── IAM Role ──────────────────────────────────────────────────────────────
  AppBedrockRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: AiBiomedicalResearchAssistantRole
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockInvokePolicy
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - !Sub arn:aws:bedrock:*:${AWS::AccountId}:inference-profile/global.anthropic.claude-haiku-4-5-20251001-v1:0-20260217-v1:0
                  - arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0-20260217-v1:0
                  - arn:aws:bedrock:::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0-20260217-v1:0

  # ── 1. AI Research Summary ────────────────────────────────────────────────
  AIResearchSummaryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ai-biomedical-ai-research-summary
      CodeUri: lambdas/ai_research_summary/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  # ── 2. Keyword Extraction ─────────────────────────────────────────────────
  KeywordExtractionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ai-biomedical-keyword-extraction
      CodeUri: lambdas/keyword_extraction/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  # ── 3. Gene-Disease-Treatment Relationship Table ──────────────────────────
  GeneDiseaseeTreatmentRelationshipTableFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ai-biomedical-gene-disease-treatment
      CodeUri: lambdas/gene_disease_treatment/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  # ── 4. Biological Dataset Interpretation ─────────────────────────────────
  BiologicalDatasetInterpretationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ai-biomedical-biological-dataset-interpretation
      CodeUri: lambdas/biological_dataset_interpretation/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  # ── 5. Plain Language Explanation ────────────────────────────────────────
  PlainLanguageExplanationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ai-biomedical-plain-language-explanation
      CodeUri: lambdas/plain_language_explanation/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  # ── 6. Suggested Future Research ─────────────────────────────────────────
  SuggestedFutureResearchFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ai-biomedical-suggested-future-research
      CodeUri: lambdas/suggested_future_research/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  # ── 7. Discussion Questions ───────────────────────────────────────────────
  DiscussionQuestionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ai-biomedical-discussion-questions
      CodeUri: lambdas/discussion_questions/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  # ── 8. Study Timeline ────────────────────────────────────────────────────
  StudyTimelineFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ai-biomedical-study-timeline
      CodeUri: lambdas/study_timeline/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  # ── 9. Research Limitations Detector ─────────────────────────────────────
  ResearchLimitationsDetectorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ai-biomedical-research-limitations-detector
      CodeUri: lambdas/research_limitations_detector/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  # ── 10. Drug Repurposing Suggestions ─────────────────────────────────────
  DrugRepurposingSuggestionsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ai-biomedical-drug-repurposing-suggestions
      CodeUri: lambdas/drug_repurposing_suggestions/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  # ── 11. Experiment Planner ────────────────────────────────────────────────
  ExperimentPlannerFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ai-biomedical-experiment-planner
      CodeUri: lambdas/experiment_planner/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  # ── 12. Paper Comparison ─────────────────────────────────────────────────
  PaperComparisonFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: ai-biomedical-paper-comparison
      CodeUri: lambdas/paper_comparison/
      Handler: run.sh
      Role: !GetAtt AppBedrockRole.Arn
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  # ── S3 Frontend Bucket ────────────────────────────────────────────────────
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ai-biomedical-research-assistant-frontend-${AWS::AccountId}
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: '*'
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${FrontendBucket}/*

# ── Outputs ───────────────────────────────────────────────────────────────
Outputs:
  AIResearchSummaryUrl:
    Description: Function URL for AI Research Summary
    Value: !GetAtt AIResearchSummaryFunctionUrl.FunctionUrl

  KeywordExtractionUrl:
    Description: Function URL for Keyword Extraction
    Value: !GetAtt KeywordExtractionFunctionUrl.FunctionUrl

  GeneDiseaseeTreatmentRelationshipTableUrl:
    Description: Function URL for Gene-Disease-Treatment Relationship Table
    Value: !GetAtt GeneDiseaseeTreatmentRelationshipTableFunctionUrl.FunctionUrl

  BiologicalDatasetInterpretationUrl:
    Description: Function URL for Biological Dataset Interpretation
    Value: !GetAtt BiologicalDatasetInterpretationFunctionUrl.FunctionUrl

  PlainLanguageExplanationUrl:
    Description: Function URL for Plain Language Explanation
    Value: !GetAtt PlainLanguageExplanationFunctionUrl.FunctionUrl

  SuggestedFutureResearchUrl:
    Description: Function URL for Suggested Future Research
    Value: !GetAtt SuggestedFutureResearchFunctionUrl.FunctionUrl

  DiscussionQuestionsUrl:
    Description: Function URL for Discussion Questions
    Value: !GetAtt DiscussionQuestionsFunctionUrl.FunctionUrl

  StudyTimelineUrl:
    Description: Function URL for Study Timeline
    Value: !GetAtt StudyTimelineFunctionUrl.FunctionUrl

  ResearchLimitationsDetectorUrl:
    Description: Function URL for Research Limitations Detector
    Value: !GetAtt ResearchLimitationsDetectorFunctionUrl.FunctionUrl

  DrugRepurposingSuggestionsUrl:
    Description: Function URL for Drug Repurposing Suggestions
    Value: !GetAtt DrugRepurposingSuggestionsFunctionUrl.FunctionUrl

  ExperimentPlannerUrl:
    Description: Function URL for Experiment Planner
    Value: !GetAtt ExperimentPlannerFunctionUrl.FunctionUrl

  PaperComparisonUrl:
    Description: Function URL for Paper Comparison
    Value: !GetAtt PaperComparisonFunctionUrl.FunctionUrl

  WebsiteUrl:
    Description: S3 Static Website URL
    Value: !GetAtt FrontendBucket.WebsiteURL

  BucketName:
    Description: S3 Bucket Name for frontend deployment
    Value: !Ref FrontendBucket
